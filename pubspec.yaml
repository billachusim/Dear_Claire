dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/StoreLogo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/iconWhitePetal.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/iconWhitePetal.png"
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - secrets/
    - assets/images/
    - assets/audio/
    - assets/time/latest.tzf
    - assets/web_games/space/index.html
    - assets/web_games/tictactoe/index.html
    - assets/web_games/tictactoe/index2.html
    - assets/tweet/index.html
