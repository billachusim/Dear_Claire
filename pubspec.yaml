  focused_menu: ^1.0.5
  intl: ^0.20.2
  flutter_sound: ^9.28.0
  audioplayers: ^6.5.1
  wave: ^0.2.2
  page_transition: ^2.2.1
  logger: ^2.6.2
  uuid: ^4.5.2
  shared_preferences: ^2.1.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  flutter_swipe_detector: ^2.0.0
  smooth_page_indicator: ^1.2.1
  timezone: ^0.10.1
  table_calendar: ^3.2.0
  auto_size_text_field: ^2.2.4
  google_mobile_ads: ^6.0.0
  universal_html: ^2.3.0
  flip_card: ^0.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^12.0.1
  screenshot: ^3.0.0
  path_provider: ^2.0.15
  video_thumbnail: ^0.5.6
  video_player: ^2.10.1
  timeago: ^3.2.4
  shake: ^3.0.0
  vibration: ^3.1.4
  flutter_staggered_grid_view: ^0.7.0
  flutter_staggered_animations: ^1.1.1
  animated_text_kit: ^4.3.0
  flutter_background_service: ^5.1.0
  record: ^6.1.2
  permission_handler: ^12.0.1
  webview_flutter: ^4.13.0
  path: ^1.9.1
  velocity_x: ^4.3.1
  app_tracking_transparency: ^2.0.6+1
  flutter_linkify: ^6.0.0
  googleapis_auth: ^1.4.1
  fl_chart: ^1.1.1
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  percent_indicator: ^4.2.5
  animate_do: ^4.2.0
  flutter_email_sender: ^8.0.0
  agora_rtc_engine: ^6.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/iconWhitePetal.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/iconWhitePetal.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/iconWhitePetal.png"
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - secrets/
    - assets/images/
    - assets/audio/
    - assets/time/latest.tzf
    - assets/web_games/space/index.html
    - assets/web_games/tictactoe/index.html
    - assets/web_games/tictactoe/index2.html
    - assets/tweet/index.html
