# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/iconWhitePetal.jpeg"
  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/iconWhitePetal.jpeg"
  # adaptive_icon_foreground_inset: 16
  # adaptive_icon_monochrome: "assets/icon/monochrome.png"

  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/images/iconWhitePetal.jpeg"
  image_path_ios_tinted_grayscale: "assets/images/iconWhitePetal.jpeg"
  # desaturate_tinted_to_grayscale_ios: true
  # background_color_ios: "#ffffff"

  web:
    generate: true
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

  windows:
    generate: true
    image_path: "path/to/image.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "path/to/image.png"
